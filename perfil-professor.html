<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-library | Perfil do Professor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body> 

<div class="profile-header d-flex flex-column align-items-center justify-content-center">
    <h2 class="fw-bold mb-3">Painel do Usuário</h2> 
    <div class="avatar-wrapper shadow">
        <i class="bi bi-mortarboard-fill"></i>
    </div>
</div>

<div class="container text-center mb-5">
    <div class="mt-2">
        <h3 class="fw-bold text-dark mb-0" id="nomeProfessor">Professor(a)</h3>
        <p class="text-muted">Docente / Pesquisador(a)</p>
    </div>

    <div class="row mt-4 justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card info-card shadow-sm p-4 border-0 rounded-4">
                <div class="row g-4 text-start">
                    <div class="col-md-6">
                        <label class="label-custom d-block">Departamento</label>
                        <span class="value-custom">Tecnologia da Informação</span>
                    </div>
                    <div class="col-md-6">
                        <label class="label-custom d-block">E-mail Institucional</label>
                        <span class="value-custom" id="emailProfessor">professor@elibrary.com.br</span>
                    </div>
                    <div class="col-md-6">
                        <label class="label-custom d-block text-uppercase small fw-bold text-muted">Categoria de Acesso</label>
                        <span class="badge bg-primary rounded-pill px-3">Corpo Docente</span>
                    </div>
                    <div class="col-md-6">
                        <label class="label-custom d-block text-uppercase small fw-bold text-muted">Privilégio de Empréstimo</label>
                        <span class="value-custom">Prazo estendido (Até 8 livros)</span>
                    </div>
                </div>
                
                <hr class="my-4 opacity-25">

                <div class="d-flex justify-content-center gap-3">
                    <a href="home-aluno.html" class="btn btn-outline-primary rounded-pill px-4">Acessar Acervo</a>
                    <button id="btnLogout" class="btn btn-outline-danger rounded-pill px-4">Sair</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts de Integração e Proteção -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script>
    // Restringe estritamente para o papel 'professor'
    verificarAcesso(['professor']);

    // Botão de Sair
    document.getElementById('btnLogout').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = 'index.html';
    });
</script>

</body>
</html>
