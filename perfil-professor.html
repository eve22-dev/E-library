<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-library | Perfil do Bibliotecário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .profile-header { background: linear-gradient(135deg, #041b5b 3%, #dc3545 100%); color: white; padding: 40px 0; text-align: center; }
        .avatar-wrapper i { font-size: 5rem; color: #fff; }
        .info-card { border-radius: 15px; }
        .label-custom { font-size: 0.85rem; color: #6c757d; font-weight: 600; text-transform: uppercase; }
        .value-custom { font-size: 1.1rem; font-weight: 500; color: #031330; }
    </style>
</head>
<body>

<div class="profile-header d-flex flex-column align-items-center justify-content-center pb-5">
    <h2 class="fw-bold mb-3">Meu Perfil</h2>
    <div class="avatar-wrapper mb-2">
        <i class="bi bi-person-badge-fill" style="font-size: 5rem; color: #fff;"></i>
    </div>
    <h3 class="fw-bold text-white mb-0" id="nomeBibliotecario">Carregando...</h3>
    <p class="text-white-50">Bibliotecário(a)</p>
</div>

<div class="container text-center mb-5" style="margin-top: -40px;">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card info-card shadow-lg p-4 border-0 rounded-4">
                <div class="row g-4 text-start">
                    <div class="col-md-6">
                        <label class="label-custom d-block">Setor de Atuação</label>
                        <span class="value-custom" id="setorBibliotecario">Gestão do Acervo</span>
                    </div>
                    <div class="col-md-6">
                        <label class="label-custom d-block">E-mail Institucional</label>
                        <span class="value-custom" id="emailBibliotecario">Carregando...</span>
                    </div>
                    <div class="col-12 mt-3">
                        <label class="label-custom d-block mb-1">Privilégio no Sistema</label>
                        <span class="badge bg-danger rounded-pill px-3 py-2">Administrador do Sistema</span>
                    </div>
                </div>

                <hr class="my-4 opacity-25">

                <div class="d-flex justify-content-center gap-3">
                    <a href="admin-funcionario.html" class="btn btn-outline-primary rounded-pill px-4 fw-semibold">
                        <i class="bi bi-gear-fill me-1"></i> Painel de Gestão
                    </a>
                    <button id="btnLogout" class="btn btn-outline-danger rounded-pill px-5 fw-semibold">
                        <i class="bi bi-box-arrow-right me-1"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
    // Página restrita a bibliotecários (a regra de acesso também é validada no back)
    if (exigirPapel(['bibliotecario'])) {
        window.addEventListener('DOMContentLoaded', carregarPerfil);
    }

    async function carregarPerfil() {
        aplicarAcessibilidadeSalva();

        try {
            const resposta = await fetch(`${API_URL}/api/me`);
            if (!resposta.ok) throw new Error('Falha ao carregar o perfil');

            const usuario = await resposta.json();

            document.getElementById('nomeBibliotecario').textContent = usuario.nome;
            document.getElementById('emailBibliotecario').textContent = usuario.email;
        } catch (erro) {
            document.getElementById('nomeBibliotecario').textContent = 'Erro ao carregar o perfil';
        }
    }

    document.getElementById('btnLogout').addEventListener('click', sair);
</script>
</body>
</html>
