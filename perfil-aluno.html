        .info-card { border-radius: 15px; }
        .label-custom { font-size: 0.85rem; color: #6c757d; font-weight: 600; text-transform: uppercase; }
        .value-custom { font-size: 1.1rem; font-weight: 500; color: #031330; }

<body> 

    <div class="profile-header d-flex flex-column align-items-center justify-content-center pb-5">

    </div>
    <!-- O nome e o RGM agora ficam aqui dentro, com as classes text-white e text-white-50 -->

<!-- A margem negativa agora puxa apenas o card para cima do degradê -->

                <div class="row g-4 text-start">
                    <div class="col-md-6">
                        <label class="label-custom d-block">Curso</label>
                        <span class="value-custom" id="cursoAluno">Carregando...</span>
                    </div>
                    <div class="col-md-6">
                        <label class="label-custom d-block">E-mail Institucional</label>

                <hr class="my-4 opacity-25">

                <div class="d-flex justify-content-center gap-3">

                    <button id="btnLogout" class="btn btn-outline-danger rounded-pill px-5">Sair</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

                    const BACKEND_URL = "https://e-library-backend-qytl.onrender.com";

            let tamanhoFonteAtual = 16;
        function aplicarAcessibilidadeSalva() {
            const fonteSalva = localStorage.getItem('acessibilidade_fonte');
            if (fonteSalva) { tamanhoFonteAtual = parseInt(fonteSalva); document.documentElement.style.fontSize = tamanhoFonteAtual + 'px'; }
            const contrasteSalvo = localStorage.getItem('acessibilidade_contraste');
            if (contrasteSalvo === 'true') document.body.classList.add('alto-contraste');
        }

    async function carregarPerfil() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = "index.html";
            return;
        }

        const { data: usuario } = await supabaseClient
            .from('usuarios')
            .select('*')
            .eq('id', session.user.id)
            .single();

        if (usuario) {
            document.getElementById('nomeAluno').textContent = usuario.nome;
            document.getElementById('rgmAluno').textContent = `RGM: ${usuario.rgm || 'Não possui'}`;
            document.getElementById('emailAluno').textContent = usuario.email;
            document.getElementById('cursoAluno').textContent = usuario.curso || 'Não cadastrado';
        }
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    });

    window.addEventListener('DOMContentLoaded', carregarPerfil);
</script>
