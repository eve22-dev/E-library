<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-library | Perfil do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; }
        .profile-header { background: linear-gradient(135deg, #031330 30%, #b50f0f 100%); color: #fff; padding: 40px 0 70px; text-align: center; }
        .avatar { width: 140px; height: 140px; border-radius: 50%; border: 5px solid #fff; background: #fff; margin: 0 auto; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,.15); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar i { font-size: 5rem; color: #0a2350; }
        .info-card { border-radius: 20px; margin-top: -50px; border: none; }
        .label-custom { font-size: .75rem; color: #6c757d; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .value-custom { color: #031330; font-weight: 600; font-size: 1.05rem; display: block; }
    </style>
</head>
<body>

<div class="profile-header">
    <h2 class="fw-bold mb-3">Meu Perfil</h2>
    <div class="avatar mb-2">
        <i class="bi bi-person-circle" id="avatarIcone"></i>
        <img id="avatarImg" alt="Foto de perfil" hidden>
    </div>
    <h3 class="fw-bold mb-0 mt-3" id="nomeUsuario">Carregando...</h3>
    <p class="text-white-50 mb-0">Usuário da biblioteca</p>
</div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card info-card shadow-lg p-4">
                <div class="row g-4 text-start">
                    <div class="col-md-6">
                        <label class="label-custom d-block">E-mail institucional</label>
                        <span class="value-custom" id="emailUsuario">Carregando...</span>
                    </div>
                    <div class="col-md-6">
                        <label class="label-custom d-block">RGM</label>
                        <span class="value-custom" id="rgmUsuario">Carregando...</span>
                    </div>
                    <div class="col-md-6">
                        <label class="label-custom d-block">Curso</label>
                        <span class="value-custom" id="cursoUsuario">Carregando...</span>
                    </div>
                </div>

                <hr class="my-4 opacity-25">

                <h6 class="fw-bold">Foto de perfil</h6>
                <div class="d-flex flex-wrap gap-2 align-items-center">
                    <input type="file" id="fotoInput" accept=".jpg,.jpeg,.png" class="form-control form-control-sm" style="max-width: 320px;">
                    <button class="btn btn-primary btn-sm rounded-pill" id="btnFoto" type="button"><i class="bi bi-camera me-1"></i>Enviar foto</button>
                </div>
                <div class="form-text mb-3">JPG ou PNG, até 2 MB.</div>

                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="notifEmail">
                    <label class="form-check-label fw-semibold" for="notifEmail">Receber avisos de prazo por e-mail</label>
                    <div class="form-text">Enviamos um aviso 3 dias antes do vencimento e, se o livro estiver atrasado, a cada 3 dias. Você pode desativar quando quiser.</div>
                </div>

                <hr class="my-4 opacity-25">

                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a href="home-aluno.html" class="btn btn-outline-primary rounded-pill px-4">Voltar para Home</a>
                    <button class="btn btn-outline-secondary rounded-pill px-4" type="button" data-tema-btn="1"></button>
                    <button id="btnLogout" class="btn btn-outline-danger rounded-pill px-4" type="button">Sair</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
    if (exigirPapel(['aluno', 'professor'])) {
        window.addEventListener('DOMContentLoaded', carregarPerfil);
    }

    async function carregarPerfil() {
        aplicarAcessibilidadeSalva();

        try {
            const resposta = await fetch(`${API_URL}/api/me`);
            if (!resposta.ok) throw new Error('Falha ao carregar o perfil');
            const u = await resposta.json();

            document.getElementById('nomeUsuario').textContent = u.nome;
            document.getElementById('emailUsuario').textContent = u.email;
            document.getElementById('rgmUsuario').textContent = u.rgm || 'Não possui';
            document.getElementById('cursoUsuario').textContent = u.curso || 'Não cadastrado';
            const notif = document.getElementById('notifEmail');
            notif.checked = !!u.notificarEmail;
            notif.addEventListener('change', async () => {
                const resposta = await fetch(`${API_URL}/api/me/preferencias`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notificarEmail: notif.checked })
                });
                const texto = await resposta.text();
                alert(texto);
                if (!resposta.ok) notif.checked = !notif.checked;
            });

            if (u.temFoto) carregarFoto();
        } catch (erro) {
            document.getElementById('nomeUsuario').textContent = 'Erro ao carregar o perfil';
        }
    }

    async function carregarFoto() {
        const resposta = await fetch(`${API_URL}/api/me/foto`);
        if (!resposta.ok) return;

        const imagem = document.getElementById('avatarImg');
        imagem.src = URL.createObjectURL(await resposta.blob());
        imagem.hidden = false;
        document.getElementById('avatarIcone').hidden = true;
    }

    document.getElementById('btnFoto').addEventListener('click', async () => {
        const arquivo = document.getElementById('fotoInput').files[0];
        if (!arquivo) { alert('Escolha uma imagem JPG ou PNG.'); return; }

        const dados = new FormData();
        dados.append('foto', arquivo);

        try {
            const resposta = await fetch(`${API_URL}/api/me/foto`, { method: 'POST', body: dados });
            const texto = await resposta.text();
            alert(texto);
            if (resposta.ok) {
                document.getElementById('fotoInput').value = '';
                carregarFoto();
            }
        } catch (erro) {
            alert('Erro de comunicação com o servidor.');
        }
    });

    document.getElementById('btnLogout').addEventListener('click', sair);
</script>
</body>
</html>
