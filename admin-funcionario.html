<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-library | Painel do Bibliotecário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #041b5b 20%, #dc3545 100%);  color: white; position: fixed; width: 260px; z-index: 1000; }
        .sidebar .nav-link { color: #cbd5e1; border-radius: 8px; margin-bottom: 5px; transition: all 0.3s; cursor: pointer; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #3b82f6; color: white; }
        .main-content { margin-left: 260px; padding: 30px; }
        .action-btn { font-size: 0.85rem; padding: 0.25rem 0.75rem; }
    </style>
</head>
<body>

    <!-- VLIBRAS -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <!-- BARRA LATERAL -->
    <div class="sidebar p-4 d-flex flex-column justify-content-between">
        <div>
            <h4 class="fw-bold mb-4 text-white"><i class="bi bi-book-half me-2"></i>E-library</h4>
            <hr class="border-secondary opacity-50 mb-4">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a class="nav-link active" onclick="mudarAba('emprestimos', event)"><i class="bi bi-arrow-left-right me-2"></i> Empréstimos</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link" onclick="mudarAba('exemplares', event)"><i class="bi bi-journal-plus me-2"></i> Cadastro de Exemplares</a>
                </li>
                <li class="nav-item mb-2">
                <a class="nav-link" onclick="mudarAba('acervo', event)"><i class="bi bi-journals me-2"></i> Acervo</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link" onclick="mudarAba('tabelas', event)"><i class="bi bi-table me-2"></i> Tabelas e Códigos</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link" onclick="mudarAba('relatorios', event)"><i class="bi bi-file-earmark-bar-graph me-2"></i> Relatórios</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link position-relative" onclick="mudarAba('mensagens', event)">
                        <i class="bi bi-chat-dots me-2"></i> Solicitações Chat
                        <span class="position-absolute top-50 start-85 translate-middle p-1 bg-danger border border-light rounded-circle" id="badgeNotificacao"></span>
                    </a>
                </li>
            </ul>
        </div>
        <div>
            <hr class="border-secondary opacity-50">
            <!-- BOTÃO SAIR CORRIGIDO -->
            <button id="btnLogout" class="btn btn-outline-light w-100 rounded-pill btn-sm fw-bold">
                <i class="bi bi-box-arrow-right me-2"></i> Sair
            </button>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DINÂMICO -->
    <div class="main-content">
        <div id="conteudoDinamico">
            <!-- Renderizado via JS -->
        </div>
    </div>

    <!-- SCRIPTS E INTEGRAÇÕES -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <!-- MODAL: EDITAR CATEGORIA -->
        <div class="modal fade" id="modalEditarCategoria" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4">
            <div class="modal-header">
            <h5 class="modal-title fw-bold">Editar categoria</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
            <input type="hidden" id="editCatId">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nome</label>
                <input type="text" id="editCatNome" class="form-control">
            </div>
            <div>
                <label class="form-label fw-semibold">Descrição</label>
                <textarea id="editCatDesc" class="form-control" rows="3"></textarea>
            </div>
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" onclick="salvarEdicaoCategoria()">Salvar</button>
            </div>
        </div></div>
        </div>

        <!-- MODAL: EXCLUIR CATEGORIA -->
        <div class="modal fade" id="modalExcluirCategoria" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4">
            <div class="modal-header">
            <h5 class="modal-title fw-bold text-danger">Excluir categoria</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
            <input type="hidden" id="excluirCatId">
            <p>Categoria: <strong id="excluirCatNome"></strong></p>
            <label class="form-label fw-semibold">Motivo (obrigatório)</label>
            <textarea id="excluirCatMotivo" class="form-control" rows="3"></textarea>
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" onclick="confirmarExclusaoCategoria()">Excluir</button>
            </div>
        </div></div>
        </div>

        <!-- MODAL: ENTREGAR (bipar o exemplar) -->
        <div class="modal fade" id="modalEntrega" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4">
            <div class="modal-header">
            <h5 class="modal-title fw-bold"><i class="bi bi-upc-scan me-2"></i>Entregar exemplar</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
            <input type="hidden" id="entregaId">
            <p class="mb-3">Livro: <strong id="entregaTitulo"></strong></p>
            <label class="form-label fw-semibold">Código do exemplar</label>
            <input type="text" id="entregaCodigo" class="form-control" placeholder="Bipe a etiqueta da cópia que está saindo" autocomplete="off">
            <div class="form-text">O leitor digita o código e confirma sozinho (Enter).</div>
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-success fw-bold" onclick="confirmarEntrega()"><i class="bi bi-check2-circle"></i> Confirmar entrega</button>
            </div>
        </div></div>
        </div>

        <!-- MODAL: REPOSIÇÃO DE LIVRO EXTRAVIADO -->
        <div class="modal fade" id="modalReposicao" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4">
            <div class="modal-header">
            <h5 class="modal-title fw-bold"><i class="bi bi-box-seam me-2"></i>Registrar reposição</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
            <input type="hidden" id="reposicaoId">
            <p class="mb-3">Livro: <strong id="reposicaoTitulo"></strong></p>
            <label class="form-label fw-semibold">Código do exemplar NOVO entregue pelo usuário</label>
            <input type="text" id="reposicaoCodigo" class="form-control" placeholder="Bipe a etiqueta do exemplar novo" autocomplete="off">
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-success fw-bold" onclick="confirmarReposicao()"><i class="bi bi-check-lg"></i> Registrar reposição</button>
            </div>
        </div></div>
        </div>

        <!-- MODAL: EXEMPLARES DE UM LIVRO -->
        <div class="modal fade" id="modalExemplares" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content rounded-4">
            <div class="modal-header">
            <h5 class="modal-title fw-bold"><i class="bi bi-upc me-2"></i>Exemplares: <span id="exemplaresTitulo"></span></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
            <input type="hidden" id="exemplaresLivroId">
            <div id="listaExemplares" class="table-responsive mb-4"></div>
            <label class="form-label fw-semibold">Adicionar exemplar</label>
            <div class="input-group">
                <input type="text" id="exemplaresNovoCodigo" class="form-control" placeholder="Bipe a etiqueta do novo exemplar" autocomplete="off">
                <button type="button" class="btn btn-primary" onclick="adicionarExemplarAoLivro()"><i class="bi bi-plus-lg"></i> Adicionar</button>
            </div>
            </div>
        </div></div>
        </div>
    <script src="api.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        // Só bibliotecário entra aqui (o back também valida o papel em cada rota)
        exigirPapel(['bibliotecario']);

        new window.VLibras.Widget('https://vlibras.gov.br/app');

        // INICIALIZAÇÃO DA PÁGINA
        document.addEventListener('DOMContentLoaded', () => {
            mudarAba('emprestimos', { currentTarget: document.querySelector('.nav-link.active') });
            carregarCategorias(); // Carrega as categorias REAIS do banco logo ao abrir o site
        });

        // NAVEGAÇÃO DE ABAS
        function mudarAba(aba, event) {
            if(event && event.currentTarget) {
                document.querySelectorAll('.sidebar .nav-link').forEach(link => link.classList.remove('active'));
                event.currentTarget.classList.add('active');
            }

            const container = document.getElementById('conteudoDinamico');
            
            if (aba === 'emprestimos') {
    container.innerHTML = `
        <h2 class="fw-bold text-dark">Gerenciamento de Empréstimos</h2>
        <p class="text-muted">Entregue reservas, decida renegociações, registre devoluções e acompanhe as multas.</p>

        <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-box-arrow-up-right me-2 text-primary"></i>Reservas aguardando retirada</h5>
            <div id="listaEmprestimos" class="table-responsive">
                <p class="text-muted"><span class="spinner-border spinner-border-sm text-primary"></span> Carregando...</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-arrow-repeat me-2 text-info"></i>Pedidos de renegociação de prazo</h5>
            <div id="listaRenegociacoes" class="table-responsive">
                <p class="text-muted"><span class="spinner-border spinner-border-sm text-primary"></span> Carregando...</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-box-arrow-in-down-left me-2 text-success"></i>Livros emprestados (aguardando devolução)</h5>
            <div id="listaDevolucoes" class="table-responsive">
                <p class="text-muted"><span class="spinner-border spinner-border-sm text-primary"></span> Carregando...</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-exclamation-octagon me-2 text-dark"></i>Extravios aguardando reposição (prazo de 30 dias)</h5>
            <div id="listaExtraviados" class="table-responsive">
                <p class="text-muted"><span class="spinner-border spinner-border-sm text-primary"></span> Carregando...</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-cash-coin me-2 text-danger"></i>Multas (R$ 2,00 por dia de atraso)</h5>
            <div id="listaMultas" class="table-responsive">
                <p class="text-muted"><span class="spinner-border spinner-border-sm text-primary"></span> Carregando...</p>
            </div>
        </div>`;
    carregarEmprestimos();
    carregarRenegociacoes();
    carregarDevolucoes();
    carregarExtraviados();
    carregarMultas();

            } else if (aba === 'exemplares') {
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Cadastro de Exemplares</h2>
                    <p class="text-muted">Cadastre pelo leitor de código de barras ou de forma manual. Cada exemplar (cópia física) tem o seu próprio código.</p>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">

                        <!-- PASSO 1: ISBN -->
                        <div id="passoIsbn">
                            <label class="form-label fw-semibold"><i class="bi bi-upc-scan me-1"></i>ISBN do livro</label>
                            <div class="input-group" style="max-width: 560px;">
                                <input type="text" id="cadIsbn" class="form-control" placeholder="Bipe o código de barras do livro ou digite o ISBN" autocomplete="off">
                                <button class="btn btn-primary" type="button" onclick="buscarLivroPorIsbn()"><i class="bi bi-search"></i> Buscar</button>
                            </div>
                            <div class="form-text">O leitor digita o código no campo e confirma sozinho (Enter).</div>
                            <button type="button" class="btn btn-link px-0 mt-2" onclick="cadastroManualSemIsbn()">Livro sem ISBN? Cadastrar manualmente</button>
                        </div>

                        <!-- PASSO 2: dados + códigos dos exemplares -->
                        <div id="passoDados" class="d-none mt-4">
                            <input type="hidden" id="cadLivroId">

                            <div id="livroEncontrado" class="alert alert-info d-none"></div>

                            <div id="camposLivro" class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Título do Livro</label>
                                    <input type="text" id="livroTitulo" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Autor</label>
                                    <input type="text" id="livroAutor" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Editora</label>
                                    <input type="text" id="livroEditora" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold text-primary">Categoria do Livro</label>
                                    <select id="livroCategoriaId" class="form-select border-primary">
                                        <option value="" disabled selected>Carregando categorias...</option>
                                    </select>
                                </div>
                            </div>

                            <hr>
                            <label class="form-label fw-semibold"><i class="bi bi-upc me-1"></i>Códigos dos exemplares</label>
                            <div class="input-group" style="max-width: 820px;">
                                <input type="text" id="cadCodigo" class="form-control" placeholder="Bipe ou digite o código e pressione Enter (ou cole vários, separados por vírgula ou espaço)" autocomplete="off">
                                <button type="button" class="btn btn-primary" onclick="adicionarCodigo()"><i class="bi bi-plus-lg"></i> Adicionar</button>
                                <input type="number" id="qtdGerar" class="form-control" value="1" min="1" max="50" style="max-width: 80px;" title="Quantos códigos gerar">
                                <button type="button" class="btn btn-outline-secondary" onclick="gerarCodigoAutomatico()">Gerar código(s)</button>
                            </div>
                            <div class="form-text">Cadastre vários exemplares de uma vez: cada Adicionar (ou Enter) coloca mais um código na lista. Depois é só salvar tudo junto.</div>
                            <div class="d-flex align-items-center gap-3 mt-3">
                                <strong id="contadorCodigos"></strong>
                                <button type="button" class="btn btn-link btn-sm text-danger p-0" onclick="limparCodigos()">Limpar lista</button>
                            </div>
                            <div id="listaCodigos" class="d-flex flex-wrap gap-2 mt-2"></div>

                            <div class="mt-4 d-flex gap-2">
                                <button type="button" id="btnSalvarExemplares" class="btn btn-primary px-4 fw-bold" onclick="salvarExemplares()">
                                    <i class="bi bi-check-lg"></i> Salvar exemplares
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="mudarAba('exemplares')">Novo livro</button>
                            </div>
                        </div>
                    </div>`;
                carregarCategorias();
                iniciarTelaCadastro();

            } else if (aba === 'tabelas') {
                container.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold text-dark mb-0">Tabelas e Códigos (Categorias)</h2>
                            <p class="text-muted">Crie e visualize categorias para organizar o acervo.</p>
                        </div>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-5">
                            <div class="card shadow-sm border-0 bg-white rounded-4 h-100">
                                <div class="card-body p-4">
                                    <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-2 text-primary"></i>Nova Categoria</h5>
                                    <form id="formCadastroCategoria" onsubmit="cadastrarCategoria(event)">
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Nome da Categoria</label>
                                            <input type="text" id="catNome" class="form-control" required placeholder="Ex: Engenharia">
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label fw-semibold">Descrição</label>
                                            <textarea id="catDesc" class="form-control" rows="3" placeholder="Opcional"></textarea>
                                        </div>
                                        <button type="submit" id="btnSalvarCategoria" class="btn btn-primary shadow-sm w-100 fw-bold">
                                            <i class="bi bi-save me-1"></i> Criar Categoria
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="card shadow-sm border-0 rounded-4 h-100 bg-white">
                                <div class="card-body p-4">
                                    <h5 class="fw-bold mb-3"><i class="bi bi-tags me-2 text-primary"></i>Categorias Cadastradas</h5>
                                    <div class="table-responsive" style="max-height: 350px; overflow-y: auto;">
                                        <table class="table table-hover align-middle">
                                            <thead class="table-light sticky-top">
                                                <tr>
                                                    <th>Nome</th>
                                                    <th>Descrição</th>
                                                    <th class="text-end">Ações</th>
                                                </tr>
                                            </thead>
                                            <tbody id="lista-categorias-admin">
                                                <tr><td colspan="3" class="text-center text-muted"><span class="spinner-border spinner-border-sm text-primary"></span> Carregando do banco de dados...</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                carregarCategorias();

            } else if (aba === 'mensagens') {
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Solicitações de Atendimento (Chat)</h2>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                        <div id="listaMensagens" class="list-group">
                            <p class="text-muted">Integração pendente.</p>
                        </div>
                    </div>`;
            } else {
                container.innerHTML = `<h2 class="fw-bold text-dark">Em Desenvolvimento</h2>`;
            }
        }

        // --- BUSCAR E PREENCHER CATEGORIAS (via back-end) ---
        async function carregarCategorias() {
            try {
                const resposta = await fetch(`${BACKEND_URL}/api/categorias`);
                if (!resposta.ok) throw new Error('Falha ao carregar categorias');
                const categorias = await resposta.json();
                
                window.categoriasCache = categorias;

                const tbody = document.getElementById('lista-categorias-admin');
                const selectLivro = document.getElementById('livroCategoriaId');
                
                if(tbody) tbody.innerHTML = '';
                if(selectLivro) selectLivro.innerHTML = '<option value="" disabled selected>Selecione uma categoria...</option>';

                if (categorias.length === 0) {
                    if(tbody) tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted small">Nenhuma categoria cadastrada.</td></tr>';
                    return;
                }

                categorias.forEach(cat => {
                    // Preenche a tabela real
                    if(tbody) {
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-semibold text-dark">${cat.nome}</td>
                                <td class="small text-muted text-truncate" style="max-width: 150px;" title="${cat.descricao || ''}">${cat.descricao || '-'}</td>
                                <td class="text-end text-nowrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="editarCategoria('${cat.id}')">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="excluirCategoria('${cat.id}')">
                                        <i class="bi bi-trash"></i> Excluir
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="navigator.clipboard.writeText('${cat.id}'); alert('UUID Copiado!');" title="Copiar ID: ${cat.id}">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    }
                    // Preenche o Select dinâmico
                    if(selectLivro) {
                        selectLivro.innerHTML += `<option value="${cat.id}">${cat.nome}</option>`;
                    }
                });

            } catch (error) {
                console.error("Erro ao carregar categorias:", error);
                const tbody = document.getElementById('lista-categorias-admin');
                if(tbody) tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Erro ao carregar do banco de dados.</td></tr>';
            }
        }

        // 1. CARREGAR EMPRÉSTIMOS
        async function carregarEmprestimos() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/emprestimos/solicitados`, {
                    headers: getAuthHeaders()
                });
                const divLista = document.getElementById('listaEmprestimos');
                
                if(!response.ok) throw new Error("Falha na API");
                const emprestimos = await response.json();
                window.reservasCache = emprestimos;

                if(emprestimos.length === 0) {
                    divLista.innerHTML = '<p class="text-muted mb-0"><i class="bi bi-check-circle text-success me-2"></i>Nenhuma reserva pendente de retirada.</p>';
                    return;
                }

                let tabelaHTML = `<table class="table align-middle table-hover">
                    <thead class="table-light"><tr><th>Livro</th><th>Utilizador (ID)</th><th>Data Prevista</th><th>Status</th><th class="text-end">Ações</th></tr></thead><tbody>`;
                
                emprestimos.forEach(emp => {
                    tabelaHTML += `<tr>

        // 2. ENTREGAR (o bibliotecário bipa o código da cópia que está saindo)

        async function confirmarEntrega() {
            const id = document.getElementById('entregaId').value;
            const codigoExemplar = document.getElementById('entregaCodigo').value.trim();

            if (!codigoExemplar) { alert('Bipe ou digite o código do exemplar.'); return; }

                if (response.ok) {

                }
            } catch (error) {
                alert('Erro de comunicação com o servidor.');
            }
        }

        // 3. CADASTRO DE EXEMPLARES (leitor de código de barras ou manual)
        let codigosCadastro = [];
        let isbnAtual = '';

        function iniciarTelaCadastro() {
            codigosCadastro = [];
            isbnAtual = '';
            renderizarCodigos();

            const campoIsbn = document.getElementById('cadIsbn');
            const campoCodigo = document.getElementById('cadCodigo');

            // O leitor de código de barras "digita" o código e envia um Enter
            campoIsbn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buscarLivroPorIsbn(); } });
            campoCodigo.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); adicionarCodigo(); } });

            campoIsbn.focus();
        }

        async function buscarLivroPorIsbn() {
            const isbn = document.getElementById('cadIsbn').value.trim();
            if (!isbn) { alert('Bipe ou digite o ISBN do livro.'); return; }

            try {
                const response = await fetch(`${BACKEND_URL}/api/exemplares/buscar-livro?isbn=${encodeURIComponent(isbn)}`, {
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    mostrarPassoDados(await response.json(), isbn);
                } else if (response.status === 404) {
                    mostrarPassoDados(null, isbn);
                } else {
                    alert(await response.text());
                }
            } catch (error) {
                alert('Erro de comunicação com o servidor.');
            }
        }

        function cadastroManualSemIsbn() {
            document.getElementById('cadIsbn').value = '';
            mostrarPassoDados(null, '');
        }

        function mostrarPassoDados(livro, isbn) {
            isbnAtual = isbn;
            codigosCadastro = [];
            renderizarCodigos();

            document.getElementById('passoDados').classList.remove('d-none');

            const aviso = document.getElementById('livroEncontrado');
            const campos = document.getElementById('camposLivro');

            if (livro) {
                document.getElementById('cadLivroId').value = livro.id;
                aviso.className = 'alert alert-info';
                aviso.innerHTML = `<i class="bi bi-info-circle me-1"></i>Livro já cadastrado: <strong>${esc(livro.titulo)}</strong> (${esc(livro.autor)}). Hoje há <strong>${livro.qtdTotal}</strong> exemplar(es) no acervo. Informe só os códigos dos novos exemplares.`;
                campos.classList.add('d-none');
            } else {
                document.getElementById('cadLivroId').value = '';
                aviso.classList.add('d-none');
                campos.classList.remove('d-none');
            }

            document.getElementById('cadCodigo').focus();
        }

        function adicionarCodigo() {
            const campo = document.getElementById('cadCodigo');

            // Aceita um código ou vários de uma vez (separados por espaço, vírgula, ponto e vírgula ou quebra de linha)
            const novos = campo.value.split(/[\s,;]+/).map(c => c.trim().toUpperCase()).filter(Boolean);
            if (novos.length === 0) return;

            const repetidos = [];
            novos.forEach(c => {
                if (codigosCadastro.includes(c)) repetidos.push(c);
                else codigosCadastro.push(c);
            });

            renderizarCodigos();
            if (repetidos.length > 0) alert('Já estavam na lista: ' + repetidos.join(', '));

            campo.value = '';
            campo.focus();
        }

        function gerarCodigoAutomatico() {
            const qtd = Math.min(Math.max(parseInt(document.getElementById('qtdGerar').value) || 1, 1), 50);

            for (let i = 0; i < qtd; i++) {
                let codigo;
                do {
                    codigo = 'EX-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                } while (codigosCadastro.includes(codigo));
                codigosCadastro.push(codigo);
            }

            renderizarCodigos();
        }

        function removerCodigo(codigo) {
            codigosCadastro = codigosCadastro.filter(c => c !== codigo);
            renderizarCodigos();
        }

        function limparCodigos() {
            codigosCadastro = [];
            renderizarCodigos();
            document.getElementById('cadCodigo').focus();
        }

        function renderizarCodigos() {
            const div = document.getElementById('listaCodigos');
            if (!div) return;

            const n = codigosCadastro.length;

            document.getElementById('contadorCodigos').textContent = n === 1 ? '1 exemplar na lista' : `${n} exemplares na lista`;

            const btn = document.getElementById('btnSalvarExemplares');
            btn.disabled = n === 0;
            btn.innerHTML = `<i class="bi bi-check-lg"></i> ${n > 1 ? 'Salvar ' + n + ' exemplares' : 'Salvar exemplar'}`;

            div.innerHTML = n === 0
                ? '<span class="text-muted small">Nenhum exemplar adicionado ainda.</span>'
                : codigosCadastro.map(c => `
                    <span class="badge text-bg-light border fs-6 fw-normal d-inline-flex align-items-center gap-2">
                        <code>${esc(c)}</code>
                        <button type="button" class="btn-close" style="font-size: 0.6rem;" aria-label="Remover" data-codigo="${esc(c)}" onclick="removerCodigo(this.dataset.codigo)"></button>
                    </span>`).join('');
        }

        async function salvarExemplares() {
            if (codigosCadastro.length === 0) { alert('Adicione ao menos o código de um exemplar.'); return; }

            const livroId = document.getElementById('cadLivroId').value;
            let corpo;

            if (livroId) {
                corpo = { livroId, codigos: codigosCadastro };
            } else {
                const titulo = document.getElementById('livroTitulo').value.trim();
                const autor = document.getElementById('livroAutor').value.trim();
                const categoriaId = document.getElementById('livroCategoriaId').value;

                if (!titulo || !autor || !categoriaId) {
                    alert('Preencha título, autor e categoria do livro.');
                    return;
                }

                corpo = {
                    livro: {
                        titulo, autor, categoriaId,
                        editora: document.getElementById('livroEditora').value.trim(),
                        isbn: isbnAtual
                    },
                    codigos: codigosCadastro
                };
            }

            const btn = document.getElementById('btnSalvarExemplares');
            btn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/api/exemplares`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(corpo)
                });

                if (response.ok) {
                    const r = await response.json();
                    const n = r.codigosCadastrados.length;

                    // Continua no mesmo livro: dá para cadastrar mais exemplares sem repetir o processo
                    document.getElementById('cadLivroId').value = r.livroId;
                    const aviso = document.getElementById('livroEncontrado');
                    aviso.className = 'alert alert-success';
                    aviso.innerHTML = `<i class="bi bi-check-circle me-1"></i>${n} exemplar(es) cadastrado(s) para <strong>${esc(r.titulo)}</strong>. Total no acervo: <strong>${r.qtdTotal}</strong>. Pode adicionar mais exemplares deste livro ou clicar em Novo livro.`;
                    document.getElementById('camposLivro').classList.add('d-none');

                    codigosCadastro = [];
                    renderizarCodigos();
                    document.getElementById('cadCodigo').focus();
                } else {
                    alert(await response.text() || 'Erro ao salvar os exemplares.');
                    renderizarCodigos();
                }
            } catch (error) {
                alert('Erro de rede ao contactar o servidor.');
                renderizarCodigos();
            }
        }

        // 4. CADASTRAR CATEGORIA (Com a correção de sintaxe!)
        async function cadastrarCategoria(event) {
            event.preventDefault();
            const btnSalvar = document.getElementById('btnSalvarCategoria');
            btnSalvar.disabled = true;

            const novaCategoria = {
                nome: document.getElementById('catNome').value,
                descricao: document.getElementById('catDesc').value
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/livros/categorias`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(novaCategoria)
                });

                if (response.ok) {
                    alert(`Categoria criada com sucesso!`);
                    document.getElementById('formCadastroCategoria').reset();
                    carregarCategorias(); 
                } else {
                    const erroDetalhado = await response.text();
                    alert(`O backend recusou a criação.\nCódigo do Erro: ${response.status}\nDetalhe: ${erroDetalhado}`);
                }
            } catch (error) {
                alert('Erro de rede ao contactar o servidor.');
            } finally {
                btnSalvar.disabled = false;
            }
        }

// ===== EMPRÉSTIMOS: DEVOLUÇÃO, EXTRAVIO, RENEGOCIAÇÃO E MULTAS =====


// LIVROS EMPRESTADOS (aguardando devolução)
async function carregarDevolucoes() {
    const div = document.getElementById('listaDevolucoes');
    if (!div) return;

    try {
        const response = await fetch(`${BACKEND_URL}/api/emprestimos/retirados`, { headers: getAuthHeaders() });
        if (!response.ok) throw new Error('Falha na API');
        const lista = await response.json();

        if (lista.length === 0) {
            div.innerHTML = '<p class="text-muted mb-0"><i class="bi bi-check-circle text-success me-2"></i>Nenhum livro emprestado no momento.</p>';
            return;
        }

        let html = `<table class="table align-middle table-hover">
            <thead class="table-light"><tr><th>Livro</th><th>Usuário</th><th>Exemplar</th><th>Devolver até</th><th>Situação</th><th class="text-end">Ações</th></tr></thead><tbody>`;

        lista.forEach(emp => {
            const dias = emp.dataPrevista ? diasParaVencer(emp.dataPrevista) : null;
            const prevista = emp.dataPrevista ? new Date(emp.dataPrevista + 'T00:00:00').toLocaleDateString('pt-BR') : 'N/A';

            let badge = '<span class="badge bg-success rounded-pill px-3 py-2">No prazo</span>';
            if (dias !== null && dias < 0) {
                badge = `<span class="badge bg-danger rounded-pill px-3 py-2">Atrasado (${Math.abs(dias)} dia(s))</span>
                         <div class="small text-danger mt-1">Multa: ${formatarReal(Math.abs(dias) * VALOR_MULTA_DIA)}</div>`;
            } else if (dias !== null && dias <= 3) {
                badge = `<span class="badge bg-warning text-dark rounded-pill px-3 py-2">${dias === 0 ? 'Vence hoje' : 'Vence em ' + dias + ' dia(s)'}</span>`;
            }

            html += `<tr>
                <td class="fw-semibold text-dark">${esc(emp.livro?.titulo)}</td>
                <td class="small">${esc(emp.usuario?.name)}<br><span class="text-muted">${esc(emp.usuario?.email)}</span></td>
                <td><code>${esc(emp.exemplar?.codigo)}</code></td>
                <td class="small">${prevista}</td>
                <td>${badge}</td>
                <td class="text-end text-nowrap">
                    <button class="btn btn-outline-success action-btn rounded-pill fw-bold" onclick="registrarDevolucao('${emp.id}')">
                        <i class="bi bi-box-arrow-in-down-left"></i> Devolução
                    </button>
                    <button class="btn btn-outline-dark action-btn rounded-pill fw-bold" onclick="registrarExtravio('${emp.id}')">
                        <i class="bi bi-exclamation-octagon"></i> Extravio
                    </button>
                </td>
            </tr>`;
        });

        div.innerHTML = html + '</tbody></table>';
    } catch (error) {
        div.innerHTML = '<p class="text-danger">Erro ao carregar os livros emprestados.</p>';
    }
}

// REGISTRAR DEVOLUÇÃO (o back gera a multa se houve atraso)

    if (!confirm('Confirmar que o livro foi devolvido à biblioteca?')) return;

// PEDIDOS DE RENEGOCIAÇÃO
async function carregarRenegociacoes() {
    const div = document.getElementById('listaRenegociacoes');
    if (!div) return;

    try {
        const response = await fetch(`${BACKEND_URL}/api/emprestimos/renegociacoes`, { headers: getAuthHeaders() });
        if (!response.ok) throw new Error('Falha na API');
        const lista = await response.json();

        if (lista.length === 0) {
            div.innerHTML = '<p class="text-muted mb-0"><i class="bi bi-check-circle text-success me-2"></i>Nenhum pedido de renegociação pendente.</p>';
            return;
        }

        let html = `<table class="table align-middle table-hover">
            <thead class="table-light"><tr><th>Livro</th><th>Usuário</th><th>Prazo atual</th><th>Situação</th><th class="text-end">Ações</th></tr></thead><tbody>`;

        lista.forEach(emp => {
            const dias = diasParaVencer(emp.dataPrevista);
            const situacao = dias < 0
                ? `<span class="badge bg-danger rounded-pill">Atrasado (${Math.abs(dias)} dia(s))</span>`
                : `<span class="badge bg-warning text-dark rounded-pill">${dias === 0 ? 'Vence hoje' : 'Vence em ' + dias + ' dia(s)'}</span>`;

            html += `<tr>
                <td class="fw-semibold text-dark">${esc(emp.livro?.titulo)}</td>
                <td class="small">${esc(emp.usuario?.name)}<br><span class="text-muted">${esc(emp.usuario?.email)}</span></td>
                <td class="small">${new Date(emp.dataPrevista + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                <td>${situacao}</td>
                <td class="text-end text-nowrap">
                    <button class="btn btn-success action-btn rounded-pill fw-bold" onclick="decidirRenegociacao('${emp.id}', 'aprovar')">
                        <i class="bi bi-check-lg"></i> Aprovar (+7 dias)
                    </button>
                    <button class="btn btn-outline-danger action-btn rounded-pill fw-bold" onclick="decidirRenegociacao('${emp.id}', 'recusar')">
                        <i class="bi bi-x-lg"></i> Recusar
                    </button>
                </td>
            </tr>`;
        });

        div.innerHTML = html + '</tbody></table>';
    } catch (error) {
        div.innerHTML = '<p class="text-danger">Erro ao carregar os pedidos de renegociação.</p>';
    }
}

async function decidirRenegociacao(id, acao) {
    const pergunta = acao === 'aprovar' ? 'Aprovar a renegociação e dar mais 7 dias de prazo?' : 'Recusar este pedido de renegociação?';
    if (!confirm(pergunta)) return;

    try {
        const response = await fetch(`${BACKEND_URL}/api/emprestimos/${id}/renegociacao/${acao}`, {
            method: 'PUT',
            headers: getAuthHeaders()
        });

        alert(await response.text());

        if (response.ok) {
            carregarRenegociacoes();
            carregarDevolucoes();
        }
    } catch (error) {
        alert('Erro de comunicação com o servidor.');
    }
}

            html += `<tr>
                <td class="small">${esc(m.usuario?.name)}<br><span class="text-muted">${esc(m.usuario?.email)}</span></td>
                <td class="fw-semibold text-dark">${esc(m.emprestimo?.livro?.titulo)}</td>
                <td><code>${esc(m.emprestimo?.exemplar?.codigo)}</code></td>
                <td>${m.diasAtraso}</td>
                <td class="fw-semibold">${formatarReal(m.valor)}</td>
                <td>${m.status === 'pendente'
                    ? '<span class="badge bg-danger rounded-pill px-3 py-2">Pendente</span>'
                    : '<span class="badge bg-success rounded-pill px-3 py-2">Paga</span>'}</td>
            </tr>`;
        });

        div.innerHTML = html + '</tbody></table>';
    } catch (error) {
        div.innerHTML = '<p class="text-danger">Erro ao carregar as multas.</p>';
    }
}


// EXTRAVIOS AGUARDANDO REPOSIÇÃO
async function carregarExtraviados() {
    const div = document.getElementById('listaExtraviados');
    if (!div) return;

    try {
        const response = await fetch(`${BACKEND_URL}/api/emprestimos/extraviados`, { headers: getAuthHeaders() });
        if (!response.ok) throw new Error('Falha na API');
        const lista = await response.json();
        window.extraviadosCache = lista;

        if (lista.length === 0) {
            div.innerHTML = '<p class="text-muted mb-0"><i class="bi bi-check-circle text-success me-2"></i>Nenhum extravio aguardando reposição.</p>';
            return;
        }

        let html = `<table class="table align-middle table-hover">
            <thead class="table-light"><tr><th>Livro</th><th>Usuário</th><th>Exemplar perdido</th><th>Prazo de reposição</th><th class="text-end">Ações</th></tr></thead><tbody>`;

        lista.forEach(emp => {
            const dias = emp.reposicaoAte ? diasParaVencer(emp.reposicaoAte) : null;
            const prazo = emp.reposicaoAte ? new Date(emp.reposicaoAte + 'T00:00:00').toLocaleDateString('pt-BR') : 'N/A';
            const situacao = dias !== null && dias < 0
                ? '<span class="badge bg-danger rounded-pill ms-2">Prazo vencido</span>'
                : (dias !== null ? `<span class="badge bg-warning text-dark rounded-pill ms-2">${dias} dia(s)</span>` : '');

            html += `<tr>
                <td class="fw-semibold text-dark">${esc(emp.livro?.titulo)}</td>
                <td class="small">${esc(emp.usuario?.name)}<br><span class="text-muted">${esc(emp.usuario?.email)}</span></td>
                <td><code>${esc(emp.exemplar?.codigo)}</code></td>
                <td class="small">${prazo}${situacao}</td>
                <td class="text-end text-nowrap">
                    <button class="btn btn-success action-btn rounded-pill fw-bold" onclick="registrarReposicao('${emp.id}')">
                        <i class="bi bi-box-seam"></i> Reposição
                    </button>
                    <button class="btn btn-outline-dark action-btn rounded-pill fw-bold" onclick="registrarBaixa('${emp.id}')">
                        <i class="bi bi-archive"></i> Dar baixa
                    </button>
                </td>
            </tr>`;
        });

        div.innerHTML = html + '</tbody></table>';
    } catch (error) {
        div.innerHTML = '<p class="text-danger">Erro ao carregar os extravios.</p>';
    }
}

function registrarReposicao(id) {
    const emp = (window.extraviadosCache || []).find(e => e.id === id);

    document.getElementById('reposicaoId').value = id;
    document.getElementById('reposicaoTitulo').textContent = emp?.livro?.titulo || '';
    document.getElementById('reposicaoCodigo').value = '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalReposicao')).show();
}

async function confirmarReposicao() {
    const id = document.getElementById('reposicaoId').value;
    const codigoExemplar = document.getElementById('reposicaoCodigo').value.trim();

    if (!codigoExemplar) { alert('Bipe ou digite o código do exemplar novo.'); return; }

    try {
        const response = await fetch(`${BACKEND_URL}/api/emprestimos/${id}/reposicao`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify({ codigoExemplar })
        });

        const texto = await response.text();

        if (response.ok) {
            bootstrap.Modal.getInstance(document.getElementById('modalReposicao')).hide();
            alert(texto);
            carregarExtraviados();
        } else {
            alert(texto || 'Não foi possível registrar a reposição.');
        }
    } catch (error) {
        alert('Erro de comunicação com o servidor.');
    }
}

async function registrarBaixa(id) {
    if (!confirm('Dar baixa definitiva neste exemplar? Ele sai do total do acervo (o livro não foi reposto).')) return;

    try {
        const response = await fetch(`${BACKEND_URL}/api/emprestimos/${id}/baixa`, {
            method: 'PUT',
            headers: getAuthHeaders()
        });

        alert(await response.text());
        if (response.ok) carregarExtraviados();
    } catch (error) {
        alert('Erro de comunicação com o servidor.');
    }
}

// EXEMPLARES DE UM LIVRO (aba Acervo)
async function abrirExemplares(livroId) {
    const livro = (window.acervoCache || []).find(l => l.id === livroId);

    document.getElementById('exemplaresLivroId').value = livroId;
    document.getElementById('exemplaresTitulo').textContent = livro?.titulo || '';
    document.getElementById('exemplaresNovoCodigo').value = '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalExemplares')).show();

    await carregarExemplaresDoLivro();
}

async function carregarExemplaresDoLivro() {
    const livroId = document.getElementById('exemplaresLivroId').value;
    const div = document.getElementById('listaExemplares');
    div.innerHTML = '<p class="text-muted"><span class="spinner-border spinner-border-sm text-primary"></span> Carregando...</p>';

    const cores = { disponivel: 'success', emprestado: 'primary', extraviado: 'danger', baixado: 'secondary' };

    try {
        const response = await fetch(`${BACKEND_URL}/api/exemplares?livroId=${livroId}`, { headers: getAuthHeaders() });
        if (!response.ok) throw new Error('Falha na API');
        const lista = await response.json();

        if (lista.length === 0) {
            div.innerHTML = '<p class="text-muted mb-0">Nenhum exemplar cadastrado.</p>';
            return;
        }

        div.innerHTML = `<table class="table align-middle mb-0">
            <thead class="table-light"><tr><th>Código</th><th>Situação</th></tr></thead><tbody>` +
            lista.map(ex => `<tr><td><code>${esc(ex.codigo)}</code></td>
                <td><span class="badge bg-${cores[ex.status] || 'secondary'} rounded-pill">${esc(ex.status)}</span></td></tr>`).join('') +
            '</tbody></table>';
    } catch (error) {
        div.innerHTML = '<p class="text-danger">Erro ao carregar os exemplares.</p>';
    }
}

async function adicionarExemplarAoLivro() {
    const livroId = document.getElementById('exemplaresLivroId').value;
    const campo = document.getElementById('exemplaresNovoCodigo');
    const codigo = campo.value.trim();

    if (!codigo) { alert('Bipe ou digite o código do exemplar.'); return; }

    try {
        const response = await fetch(`${BACKEND_URL}/api/exemplares`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ livroId, codigos: [codigo] })
        });

        if (response.ok) {
            campo.value = '';
            carregarExemplaresDoLivro();
            carregarAcervo();
        } else {
            alert(await response.text() || 'Erro ao adicionar o exemplar.');
        }
    } catch (error) {
        alert('Erro de comunicação com o servidor.');
    }
}

// O leitor de código de barras confirma com Enter nos campos dos modais
['entregaCodigo', 'reposicaoCodigo', 'exemplaresNovoCodigo'].forEach(idCampo => {
    document.getElementById(idCampo).addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (idCampo === 'entregaCodigo') confirmarEntrega();
        else if (idCampo === 'reposicaoCodigo') confirmarReposicao();
        else adicionarExemplarAoLivro();
    });
});

// Foca no campo do código assim que o modal abre (o leitor já pode bipar)
[['modalEntrega', 'entregaCodigo'], ['modalReposicao', 'reposicaoCodigo'], ['modalExemplares', 'exemplaresNovoCodigo']].forEach(([modal, campo]) => {
    document.getElementById(modal).addEventListener('shown.bs.modal', () => document.getElementById(campo).focus());
});

        document.getElementById('btnLogout').addEventListener('click', (e) => { e.preventDefault(); sair(); });
