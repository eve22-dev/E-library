<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-library | Painel do Bibliotecário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #041b5b 20%, #dc3545 100%);  color: white; position: fixed; width: 260px; }
        .sidebar .nav-link { color: #cbd5e1; border-radius: 8px; margin-bottom: 5px; transition: all 0.3s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #3b82f6; color: white; }
        .main-content { margin-left: 260px; padding: 30px; }
    </style>
</head>
<body>

    <div class="sidebar p-4 d-flex flex-column justify-content-between">
        <div>
            <h4 class="fw-bold mb-4 text-white"><i class="bi bi-book-half me-2"></i>E-library</h4>
            <hr class="border-secondary opacity-50 mb-4">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link active" onclick="mudarAba('emprestimos', event)"><i class="bi bi-arrow-left-right me-2"></i> Empréstimos</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link" onclick="mudarAba('exemplares', event)"><i class="bi bi-journal-plus me-2"></i> Cadastro de Exemplares</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link" onclick="mudarAba('tabelas', event)"><i class="bi bi-table me-2"></i> Tabelas e Códigos</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link" onclick="mudarAba('relatorios', event)"><i class="bi bi-file-earmark-bar-graph me-2"></i> Relatórios</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link position-relative" onclick="mudarAba('mensagens', event)">
                        <i class="bi bi-chat-dots me-2"></i> Solicitações Chat
                        <span class="position-absolute top-50 start-85 translate-middle p-1 bg-danger border border-light rounded-circle" id="badgeNotificacao"></span>
                    </a>
                </li>
            </ul>
        </div>
        <div>
            <hr class="border-secondary opacity-50">
            <button id="btnLogout" class="btn btn-outline-light w-100 rounded-pill btn-sm"><i class="bi bi-box-arrow-right me-2"></i> Sair</button>
        </div>
    </div>

    <!-- Conteúdo Principal Dinâmico -->
    <div class="main-content">
        <div id="conteudoDinamico">
            <!-- A aba padrão inicial -->
            <h2 class="fw-bold text-dark">Gerenciamento de Empréstimos</h2>
            <p class="text-muted">Acompanhe as retiradas e devoluções ativas no acervo.</p>
            <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                <p class="text-muted mb-0">Carregando dados de empréstimos...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_AQUI';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabase = _supabase;

        // Função simples para alternar o conteúdo das abas na mesma tela
        function mudarAba(aba, event) {
            document.querySelectorAll('.sidebar .nav-link').forEach(link => link.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const container = document.getElementById('conteudoDinamico');
            
            if (aba === 'emprestimos') {
                container.innerHTML = `<h2 class="fw-bold text-dark">Gerenciamento de Empréstimos</h2><p class="text-muted">Acompanhe as retiradas e devoluções ativas.</p><div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4"><p>Módulo de empréstimos carregado.</p></div>`;
            } else if (aba === 'exemplares') {
                container.innerHTML = `<h2 class="fw-bold text-dark">Cadastro de Exemplares</h2><p class="text-muted">Adicione novos livros e gerencie o estoque.</p><div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4"><form><div class="mb-3"><label class="form-label">Título do Livro</label><input type="text" class="form-control"></div><button class="btn btn-primary">Salvar Livro</button></form></div>`;
            } else if (aba === 'tabelas') {
                container.innerHTML = `<h2 class="fw-bold text-dark">Tabelas e Cadastros Base</h2><p class="text-muted">Gerencie categorias, códigos únicos e parâmetros.</p><div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4"><p>Tabelas auxiliares do sistema.</p></div>`;
            } else if (aba === 'relatorios') {
                container.innerHTML = `<h2 class="fw-bold text-dark">Relatórios do Sistema</h2><p class="text-muted">Gere relatórios de livros mais emprestados e atrasos.</p><div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4"><button class="btn btn-success">Exportar Relatório em PDF</button></div>`;
            } else if (aba === 'mensagens') {
                container.innerHTML = `<h2 class="fw-bold text-dark">Solicitações de Atendimento (Chat)</h2><p class="text-muted">Mensagens enviadas por alunos que precisaram de suporte humano.</p><div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4"><div class="list-group"><div class="list-group-item list-group-item-action"><strong>Aluno Silva (RGM 12345):</strong> "Professor, não acho o livro de POO disponível, tem previsão de reposição?" <span class="badge bg-warning text-dark float-end">Pendente</span></div></div></div>`;
            }
        }

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });
    </script>
    <script src="auth-guard.js"></script>
    <script>
        verificarAcesso(['professor', 'bibliotecario']);
    </script>
</body>
</html>
