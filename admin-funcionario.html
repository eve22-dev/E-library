<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-library | Painel do Bibliotecário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #041b5b 20%, #dc3545 100%);  color: white; position: fixed; width: 260px; }
        .sidebar .nav-link { color: #cbd5e1; border-radius: 8px; margin-bottom: 5px; transition: all 0.3s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #3b82f6; color: white; }
        .main-content { margin-left: 260px; padding: 30px; }
    </style>
</head>
<body>

    <div class="sidebar p-4 d-flex flex-column justify-content-between">
        <div>
            <h4 class="fw-bold mb-4 text-white"><i class="bi bi-book-half me-2"></i>E-library</h4>
            <hr class="border-secondary opacity-50 mb-4">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link active" onclick="mudarAba('emprestimos', event)"><i class="bi bi-arrow-left-right me-2"></i> Empréstimos</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link" onclick="mudarAba('exemplares', event)"><i class="bi bi-journal-plus me-2"></i> Cadastro de Exemplares</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link" onclick="mudarAba('tabelas', event)"><i class="bi bi-table me-2"></i> Tabelas e Códigos</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link" onclick="mudarAba('relatorios', event)"><i class="bi bi-file-earmark-bar-graph me-2"></i> Relatórios</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link position-relative" onclick="mudarAba('mensagens', event)">
                        <i class="bi bi-chat-dots me-2"></i> Solicitações Chat
                        <span class="position-absolute top-50 start-85 translate-middle p-1 bg-danger border border-light rounded-circle" id="badgeNotificacao"></span>
                    </a>
                </li>
            </ul>
        </div>
        <div>
            <hr class="border-secondary opacity-50">
            <button id="btnLogout" class="btn btn-outline-light w-100 rounded-pill btn-sm"><i class="bi bi-box-arrow-right me-2"></i> Sair</button>
        </div>
    </div>

    <!-- Conteúdo Principal Dinâmico -->
    <div class="main-content">
        <div id="conteudoDinamico">
            <!-- Renderizado via JS -->
        </div>
    </div>

    <!-- SDK do Supabase (Mantido para o Logout) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://axeyrwilhvbzlfukivhu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZXlyd2lsaHZiemxmdWtpdmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDE0OTYsImV4cCI6MjA5NDExNzQ5Nn0.8-hLkiSR6BPck-DtkiZiwMA5KRtfHUhjN61g4QPE68o';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabase = _supabase;

        const BACKEND_URL = "https://e-library-backend-qytl.onrender.com"; 

        // Carrega a aba de empréstimos assim que a página abre
        document.addEventListener('DOMContentLoaded', () => mudarAba('emprestimos', { currentTarget: document.querySelector('.nav-link.active') }));

        // --- SISTEMA DE ABAS E RENDERIZAÇÃO DINÂMICA ---
        function mudarAba(aba, event) {
            if(event) {
                document.querySelectorAll('.sidebar .nav-link').forEach(link => link.classList.remove('active'));
                event.currentTarget.classList.add('active');
            }

            const container = document.getElementById('conteudoDinamico');
            
            if (aba === 'emprestimos') {
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Gerenciamento de Empréstimos</h2>
                    <p class="text-muted">Acompanhe as retiradas e devoluções ativas no acervo.</p>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                        <div id="listaEmprestimos" class="table-responsive">
                            <p class="text-muted">Carregando dados do banco de dados...</p>
                        </div>
                    </div>`;
                carregarEmprestimos();

            } else if (aba === 'exemplares') {
                // FORMULÁRIO REAL DE CADASTRO
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Cadastro de Exemplares</h2>
                    <p class="text-muted">Adicione novos livros e disponibilize-os no acervo imediatamente.</p>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                        <form id="formCadastroLivro" onsubmit="cadastrarLivro(event)">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Título do Livro</label>
                                    <input type="text" id="livroTitulo" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Autor</label>
                                    <input type="text" id="livroAutor" class="form-control" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">ISBN</label>
                                    <input type="text" id="livroIsbn" class="form-control" placeholder="Opcional">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Qtd. Total (Estoque)</label>
                                    <input type="number" id="livroQtd" class="form-control" value="1" min="1" required>
                                </div>
                            </div>
                            <button type="submit" id="btnSalvarLivro" class="btn btn-primary mt-3 px-4 shadow-sm">
                                <i class="bi bi-check-lg"></i> Salvar Livro no Sistema
                            </button>
                        </form>
                    </div>`;

            } else if (aba === 'mensagens') {
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Solicitações de Atendimento (Chat)</h2>
                    <p class="text-muted">Dúvidas repassadas pela Inteligência Artificial para atendimento humano.</p>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                        <div id="listaMensagens" class="list-group">
                            <p class="text-muted">Buscando solicitações...</p>
                        </div>
                    </div>`;
                carregarMensagensSuporte();
            } else {
                // Relatórios e Tabelas (Pode expandir depois usando a mesma lógica)
                container.innerHTML = `<h2 class="fw-bold text-dark">Em Desenvolvimento</h2><p class="text-muted">Esta funcionalidade será conectada à API em breve.</p>`;
            }
        }

        // --- INTEGRAÇÃO COM O BACKEND JAVA ---

        // 1. Envia os dados do formulário para salvar o livro no Java
        async function cadastrarLivro(event) {
            event.preventDefault(); // Impede a página de recarregar
            
            const btnSalvar = document.getElementById('btnSalvarLivro');
            btnSalvar.disabled = true;
            btnSalvar.innerText = "Salvando...";

            // Monta o objeto com os dados exatos que a sua LivroEntity espera
            const novoLivro = {
                titulo: document.getElementById('livroTitulo').value,
                autor: document.getElementById('livroAutor').value,
                isbn: document.getElementById('livroIsbn').value,
                qtdTotal: parseInt(document.getElementById('livroQtd').value),
                qtdDisponivel: parseInt(document.getElementById('livroQtd').value),
                ativo: true
            };

            try {
                // Bate no endpoint POST do seu Spring Boot
                const response = await fetch(`${BACKEND_URL}/api/livros`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}` // Manda o token de segurança
                    },
                    body: JSON.stringify(novoLivro)
                });

                if (response.ok) {
                    alert('Sucesso! Livro cadastrado e já disponível para os alunos.');
                    document.getElementById('formCadastroLivro').reset(); // Limpa o form
                } else {
                    const erro = await response.text();
                    alert('Erro ao salvar livro: ' + erro);
                }
            } catch (error) {
                console.error('Erro de rede:', error);
                alert('Erro de comunicação com o servidor Java. Verifique se o backend está rodando.');
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.innerHTML = '<i class="bi bi-check-lg"></i> Salvar Livro no Sistema';
            }
        }

        // 2. Busca e desenha a tabela de empréstimos vinda do banco
        async function carregarEmprestimos() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/emprestimos`);
                const divLista = document.getElementById('listaEmprestimos');
                
                if(!response.ok) throw new Error("Falha na API");
                const emprestimos = await response.json();

                if(emprestimos.length === 0) {
                    divLista.innerHTML = '<p class="text-muted">Nenhum empréstimo ativo no momento.</p>';
                    return;
                }

                // Monta a tabela HTML com os dados reais
                let tabelaHTML = `<table class="table align-middle">
                                    <thead><tr><th>Livro</th><th>Retirada</th><th>Devolução Prevista</th><th>Status</th></tr></thead><tbody>`;
                
                emprestimos.forEach(emp => {
                    tabelaHTML += `<tr>
                                    <td class="fw-bold">${emp.tituloLivro || 'Livro não identificado'}</td>
                                    <td>${emp.dataRetirada}</td>
                                    <td>${emp.dataPrevista}</td>
                                    <td><span class="badge bg-primary">${emp.status}</span></td>
                                   </tr>`;
                });
                tabelaHTML += `</tbody></table>`;
                divLista.innerHTML = tabelaHTML;

            } catch (error) {
                document.getElementById('listaEmprestimos').innerHTML = '<p class="text-danger">Erro ao carregar os empréstimos. Servidor indisponível.</p>';
            }
        }

        // 3. Busca mensagens de suporte salvas pelo Chatbot
        async function carregarMensagensSuporte() {
            // Se você já tem um endpoint de listar mensagens, coloque a chamada fetch aqui.
            // Por enquanto, deixarei um aviso de integração pendente.
            document.getElementById('listaMensagens').innerHTML = '<p class="text-muted">Integração da lista de mensagens pendente no backend.</p>';
        }

        // --- SISTEMA DE LOGOUT ---
        document.getElementById('btnLogout').addEventListener('click', async () => {
            await window.supabase.auth.signOut();
            localStorage.clear(); // Limpa a role e tokens
            window.location.href = 'index.html';
        });

    </script>
    
    <script src="auth-guard.js"></script>
    <script>
        // Trava de segurança: Garante que só o bibliotecário entre aqui
        // verificarAcesso(['bibliotecario']);
    </script>
</body>
</html>
