<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-library | Painel do Bibliotecário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #041b5b 20%, #dc3545 100%);  color: white; position: fixed; width: 260px; z-index: 1000; }
        .sidebar .nav-link { color: #cbd5e1; border-radius: 8px; margin-bottom: 5px; transition: all 0.3s; cursor: pointer; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #3b82f6; color: white; }
        .main-content { margin-left: 260px; padding: 30px; }
        .action-btn { font-size: 0.85rem; padding: 0.25rem 0.75rem; }
    </style>
</head>
<body>

    <div class="sidebar p-4 d-flex flex-column justify-content-between">
        <div>
            <h4 class="fw-bold mb-4 text-white"><i class="bi bi-book-half me-2"></i>E-library</h4>
            <hr class="border-secondary opacity-50 mb-4">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a class="nav-link active" onclick="mudarAba('emprestimos', event)"><i class="bi bi-arrow-left-right me-2"></i> Empréstimos</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link" onclick="mudarAba('exemplares', event)"><i class="bi bi-journal-plus me-2"></i> Cadastro de Exemplares</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link" onclick="mudarAba('tabelas', event)"><i class="bi bi-table me-2"></i> Tabelas e Códigos</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link" onclick="mudarAba('relatorios', event)"><i class="bi bi-file-earmark-bar-graph me-2"></i> Relatórios</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link position-relative" onclick="mudarAba('mensagens', event)">
                        <i class="bi bi-chat-dots me-2"></i> Solicitações Chat
                        <span class="position-absolute top-50 start-85 translate-middle p-1 bg-danger border border-light rounded-circle" id="badgeNotificacao"></span>
                    </a>
                </li>
            </ul>
        </div>
        <div>
            <hr class="border-secondary opacity-50">
            <button id="btnLogout" class="btn btn-outline-light w-100 rounded-pill btn-sm"><i class="bi bi-box-arrow-right me-2"></i> Sair</button>
        </div>
    </div>

    <!-- Conteúdo Principal Dinâmico -->
    <div class="main-content">
        <div id="conteudoDinamico">
            <!-- Renderizado via JS -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://axeyrwilhvbzlfukivhu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZXlyd2lsaHZiemxmdWtpdmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDE0OTYsImV4cCI6MjA5NDExNzQ5Nn0.8-hLkiSR6BPck-DtkiZiwMA5KRtfHUhjN61g4QPE68o';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabase = _supabase;

        const BACKEND_URL = "https://e-library-backend-qytl.onrender.com"; 

        document.addEventListener('DOMContentLoaded', () => mudarAba('emprestimos', { currentTarget: document.querySelector('.nav-link.active') }));

        function mudarAba(aba, event) {
            if(event && event.currentTarget) {
                document.querySelectorAll('.sidebar .nav-link').forEach(link => link.classList.remove('active'));
                event.currentTarget.classList.add('active');
            }

            const container = document.getElementById('conteudoDinamico');
            
            if (aba === 'emprestimos') {
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Gerenciamento de Empréstimos</h2>
                    <p class="text-muted">Acompanhe as retiradas solicitadas no acervo.</p>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                        <div id="listaEmprestimos" class="table-responsive">
                            <p class="text-muted">Carregando dados do banco de dados...</p>
                        </div>
                    </div>`;
                carregarEmprestimos();

            } else if (aba === 'exemplares') {
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Cadastro de Exemplares</h2>
                    <p class="text-muted">Adicione novos livros e disponibilize-os no acervo imediatamente.</p>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                        <form id="formCadastroLivro" onsubmit="cadastrarLivro(event)">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Título do Livro</label>
                                    <input type="text" id="livroTitulo" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Autor</label>
                                    <input type="text" id="livroAutor" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Editora</label>
                                    <input type="text" id="livroEditora" class="form-control" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">ISBN</label>
                                    <input type="text" id="livroIsbn" class="form-control" placeholder="Opcional">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Qtd. Total (Estoque)</label>
                                    <input type="number" id="livroQtd" class="form-control" value="1" min="1" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">ID da Categoria</label>
                                    <input type="text" id="livroCategoriaId" class="form-control" placeholder="UUID da categoria" required>
                                </div>
                            </div>
                            <button type="submit" id="btnSalvarLivro" class="btn btn-primary mt-3 px-4 shadow-sm">
                                <i class="bi bi-check-lg"></i> Salvar Livro no Sistema
                            </button>
                        </form>
                    </div>`;

            } else if (aba === 'tabelas') {
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Tabelas e Códigos (Categorias)</h2>
                    <p class="text-muted">Crie categorias para organizar o acervo.</p>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                        <form id="formCadastroCategoria" onsubmit="cadastrarCategoria(event)">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nome da Categoria</label>
                                <input type="text" id="catNome" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Descrição</label>
                                <textarea id="catDesc" class="form-control" rows="2"></textarea>
                            </div>
                            <button type="submit" id="btnSalvarCategoria" class="btn btn-primary shadow-sm">
                                <i class="bi bi-save"></i> Criar Categoria
                            </button>
                        </form>
                    </div>`;

            } else if (aba === 'mensagens') {
                container.innerHTML = `
                    <h2 class="fw-bold text-dark">Solicitações de Atendimento (Chat)</h2>
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mt-4">
                        <div id="listaMensagens" class="list-group">
                            <p class="text-muted">Integração pendente.</p>
                        </div>
                    </div>`;
            } else {
                container.innerHTML = `<h2 class="fw-bold text-dark">Em Desenvolvimento</h2>`;
            }
        }

        // --- INTEGRAÇÃO COM O BACKEND JAVA ---

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('authToken')}`
            };
        }

        // 1. CARREGAR EMPRÉSTIMOS SOLICITADOS
        async function carregarEmprestimos() {
            try {
                // Chama a rota específica que criamos no back-end
                const response = await fetch(`${BACKEND_URL}/api/emprestimos/solicitados`, {
                    headers: getAuthHeaders()
                });
                const divLista = document.getElementById('listaEmprestimos');
                
                if(!response.ok) throw new Error("Falha na API");
                const emprestimos = await response.json();

                if(emprestimos.length === 0) {
                    divLista.innerHTML = '<p class="text-muted mb-0">Nenhuma reserva pendente de retirada.</p>';
                    return;
                }

                let tabelaHTML = `<table class="table align-middle">
                    <thead><tr><th>Livro (ID)</th><th>Utilizador (ID)</th><th>Data Prevista</th><th>Status</th><th>Ações</th></tr></thead><tbody>`;
                
                emprestimos.forEach(emp => {
                    tabelaHTML += `<tr>
                        <td class="fw-semibold text-truncate" style="max-width: 150px;" title="${emp.livro?.id}">${emp.livro?.titulo || emp.livro?.id}</td>
                        <td class="text-truncate" style="max-width: 150px;" title="${emp.usuario?.id}">${emp.usuario?.nome || emp.usuario?.id}</td>
                        <td>${emp.dataPrevista || 'N/A'}</td>
                        <td><span class="badge bg-warning text-dark">${emp.status.toUpperCase()}</span></td>
                        <td>
                            <button class="btn btn-success action-btn" onclick="marcarComoRetirado('${emp.id}')">
                                <i class="bi bi-check2-circle"></i> Entregar Livro
                            </button>
                        </td>
                    </tr>`;
                });
                tabelaHTML += `</tbody></table>`;
                divLista.innerHTML = tabelaHTML;

            } catch (error) {
                console.error(error);
                document.getElementById('listaEmprestimos').innerHTML = '<p class="text-danger">Erro ao carregar os empréstimos.</p>';
            }
        }

        // 2. MARCAR COMO RETIRADO (Ação do Bibliotecário)
        async function marcarComoRetirado(id) {
            if(!confirm("Confirmar a entrega física deste livro ao utilizador?")) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/emprestimos/${id}/retirar`, {
                    method: 'PUT',
                    headers: getAuthHeaders()
                });

                if(response.ok) {
                    alert('Status atualizado para RETIRADO com sucesso!');
                    carregarEmprestimos(); // Recarrega a tabela automaticamente
                } else {
                    const erro = await response.text();
                    alert('Erro: ' + erro);
                }
            } catch (error) {
                alert('Erro de comunicação com o servidor.');
            }
        }

        // 3. CADASTRAR LIVRO
        async function cadastrarLivro(event) {
            event.preventDefault();
            const btnSalvar = document.getElementById('btnSalvarLivro');
            btnSalvar.disabled = true;

            const novoLivro = {
                titulo: document.getElementById('livroTitulo').value,
                autor: document.getElementById('livroAutor').value,
                isbn: document.getElementById('livroIsbn').value,
                qtdTotal: parseInt(document.getElementById('livroQtd').value),
                // O back-end iguala a qtdDisponivel na Controller
                categoria: { id: document.getElementById('livroCategoriaId').value }
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/livros`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(novoLivro)
                });

                if (response.ok) {
                    alert('Livro cadastrado com sucesso!');
                    document.getElementById('formCadastroLivro').reset();
                } else {
                    alert('Erro ao salvar livro. Verifique o ID da Categoria.');
                }
            } catch (error) {
                alert('Erro de rede.');
            } finally {
                btnSalvar.disabled = false;
            }
        }

        // 4. CADASTRAR CATEGORIA
        async function cadastrarCategoria(event) {
            event.preventDefault();
            const btnSalvar = document.getElementById('btnSalvarCategoria');
            btnSalvar.disabled = true;

            const novaCategoria = {
                nome: document.getElementById('catNome').value,
                descricao: document.getElementById('catDesc').value
            };

            try {
                // Alvo da rota que definimos no Controller do Bibliotecário
                const response = await fetch(`${BACKEND_URL}/api/bibliotecario/categorias`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(novaCategoria)
                });

                if (response.ok) {
                    const catSalva = await response.json();
                    alert(`Categoria criada! Guarde este ID para cadastrar os livros: ${catSalva.id}`);
                    document.getElementById('formCadastroCategoria').reset();
                } else {
                    alert('Erro ao criar categoria.');
                }
            } catch (error) {
                alert('Erro de rede.');
            } finally {
                btnSalvar.disabled = false;
            }
        }

        // --- SISTEMA DE LOGOUT ---
        document.getElementById('btnLogout').addEventListener('click', async () => {
            await window.supabase.auth.signOut();
            localStorage.clear();
            window.location.href = 'index.html';
        });

    </script>
    <script src="auth-guard.js"></script>
</body>
</html>
