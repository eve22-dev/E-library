                    } else if (aba === 'acervo') {

    carregarAcervo();
            } else if (aba === 'tabelas') {

                                            </thead>
                                            <tbody id="lista-categorias-admin">

            } else if (aba === 'mensagens') {

        // FUNÇÕES DE COMUNICAÇÃO COM O JAVA E SUPABASE
        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('authToken')}`
            };
        }

        // --- BUSCAR E PREENCHER CATEGORIAS REAIS DO SUPABASE (Tabela e Dropdown) ---
        async function carregarCategorias() {
            try {
                // Busca direto do banco para garantir que nada é fake
                const { data: categorias, error } = await window.supabase
                    .from('categorias')
                    .select('*')
                    .eq('ativo', true)
                    .order('nome', { ascending: true });

                if (error) throw error;
                
                window.categoriasCache = categorias;

                const tbody = document.getElementById('lista-categorias-admin');
                const selectLivro = document.getElementById('livroCategoriaId');
                
                if(tbody) tbody.innerHTML = '';
                if(selectLivro) selectLivro.innerHTML = '<option value="" disabled selected>Selecione uma categoria...</option>';

                if (categorias.length === 0) {
                    if(tbody) tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted small">Nenhuma categoria cadastrada.</td></tr>';
                    return;
                }

                categorias.forEach(cat => {
                    // Preenche a tabela real
                    if(tbody) {
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-semibold text-dark">${cat.nome}</td>
                                <td class="small text-muted text-truncate" style="max-width: 150px;" title="${cat.descricao || ''}">${cat.descricao || '-'}</td>
                                <td class="text-end text-nowrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="editarCategoria('${cat.id}')">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="excluirCategoria('${cat.id}')">
                                        <i class="bi bi-trash"></i> Excluir
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="navigator.clipboard.writeText('${cat.id}'); alert('UUID Copiado!');" title="Copiar ID: ${cat.id}">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    }
                    // Preenche o Select dinâmico
                    if(selectLivro) {
                        selectLivro.innerHTML += `<option value="${cat.id}">${cat.nome}</option>`;
                    }
                });

            } catch (error) {
                console.error("Erro ao carregar categorias:", error);
                const tbody = document.getElementById('lista-categorias-admin');
                if(tbody) tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Erro ao carregar do banco de dados.</td></tr>';
            }
        }

        // 1. CARREGAR EMPRÉSTIMOS
        async function carregarEmprestimos() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/emprestimos/solicitados`, {
                    headers: getAuthHeaders()
                });
                const divLista = document.getElementById('listaEmprestimos');
                
                if(!response.ok) throw new Error("Falha na API");
                const emprestimos = await response.json();

                if(emprestimos.length === 0) {
                    divLista.innerHTML = '<p class="text-muted mb-0"><i class="bi bi-check-circle text-success me-2"></i>Nenhuma reserva pendente de retirada.</p>';
                    return;
                }

                let tabelaHTML = `<table class="table align-middle table-hover">
                    <thead class="table-light"><tr><th>Livro</th><th>Utilizador (ID)</th><th>Data Prevista</th><th>Status</th><th class="text-end">Ações</th></tr></thead><tbody>`;
                
                emprestimos.forEach(emp => {
                    tabelaHTML += `<tr>
                        <td class="fw-semibold text-dark text-truncate" style="max-width: 180px;" title="${emp.livro?.id}">${emp.livro?.titulo || emp.livro?.id}</td>
                        <td class="text-muted small text-truncate" style="max-width: 150px;" title="${emp.usuario?.id}">${emp.usuario?.nome || emp.usuario?.id}</td>
                        <td class="small">${emp.dataPrevista || 'N/A'}</td>
                        <td><span class="badge bg-warning text-dark px-3 py-2 rounded-pill">${emp.status.toUpperCase()}</span></td>
                        <td class="text-end">
                            <button class="btn btn-success action-btn rounded-pill fw-bold" onclick="marcarComoRetirado('${emp.id}')">
                                <i class="bi bi-check2-circle"></i> Entregar
                            </button>
                        </td>
                    </tr>`;
                });
                tabelaHTML += `</tbody></table>`;
                divLista.innerHTML = tabelaHTML;

            } catch (error) {
                document.getElementById('listaEmprestimos').innerHTML = '<p class="text-danger">Erro ao carregar os empréstimos. Servidor ocupado.</p>';
            }
        }

        // 2. MARCAR COMO RETIRADO
        async function marcarComoRetirado(id) {
            if(!confirm("Confirmar a entrega física deste livro ao utilizador?")) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/emprestimos/${id}/retirar`, {
                    method: 'PUT',
                    headers: getAuthHeaders()
                });

                if(response.ok) {
                    alert('Status atualizado para RETIRADO com sucesso!');
                    carregarEmprestimos(); 
                } else {
                    const erro = await response.text();
                    alert('Erro: ' + erro);
                }
            } catch (error) {
                alert('Erro de comunicação com o servidor.');
            }
        }

        // 3. CADASTRAR LIVRO
        async function cadastrarLivro(event) {
            event.preventDefault();
            const btnSalvar = document.getElementById('btnSalvarLivro');
            btnSalvar.disabled = true;

            const novoLivro = {
                titulo: document.getElementById('livroTitulo').value,
                autor: document.getElementById('livroAutor').value,
                editora: document.getElementById('livroEditora').value,
                isbn: document.getElementById('livroIsbn').value,
                qtdTotal: parseInt(document.getElementById('livroQtd').value),
                categoria: { id: document.getElementById('livroCategoriaId').value }
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/livros`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(novoLivro)
                });

                if (response.ok) {
                    alert('Livro cadastrado com sucesso e já disponível no catálogo!');
                    document.getElementById('formCadastroLivro').reset();
                } else {
                    alert('Erro ao salvar livro no Java.');
                }
            } catch (error) {
                alert('Erro de rede ao contactar o servidor.');
            } finally {
                btnSalvar.disabled = false;
            }
        }

        // 4. CADASTRAR CATEGORIA (Com a correção de sintaxe!)
        async function cadastrarCategoria(event) {
            event.preventDefault();
            const btnSalvar = document.getElementById('btnSalvarCategoria');
            btnSalvar.disabled = true;

            const novaCategoria = {
                nome: document.getElementById('catNome').value,
                descricao: document.getElementById('catDesc').value
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/livros/categorias`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(novaCategoria)
                });

                if (response.ok) {
                    alert(`Categoria criada com sucesso!`);
                    document.getElementById('formCadastroCategoria').reset();
                    carregarCategorias(); 
                } else {
                    const erroDetalhado = await response.text();
                    alert(`O backend recusou a criação.\nCódigo do Erro: ${response.status}\nDetalhe: ${erroDetalhado}`);
                }
            } catch (error) {
                alert('Erro de rede ao contactar o servidor.');
            } finally {
                btnSalvar.disabled = false;
            }
        }
        
        // LISTAR ACERVO
const esc = s => String(s ?? '-').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function carregarAcervo() {
    const div = document.getElementById('listaAcervo');
    const termo = document.getElementById('buscaAcervo')?.value || '';

    try {
        const response = await fetch(
            `${BACKEND_URL}/api/livros/pesquisa?filtro=titulo&termo=${encodeURIComponent(termo)}`,
            { headers: getAuthHeaders() }
        );
        if (!response.ok) throw new Error('Falha na API');
        const livros = await response.json();

        if (livros.length === 0) {
            div.innerHTML = '<p class="text-muted mb-0">Nenhum livro encontrado.</p>';
            return;
        }

        let html = `<table class="table align-middle table-hover">
            <thead class="table-light"><tr><th>Título</th><th>Autor</th><th>Editora</th><th>ISBN</th><th>Disponíveis</th><th class="text-end">Ações</th></tr></thead><tbody>`;

        livros.forEach(l => {
            html += `<tr>
                <td class="fw-semibold text-dark">${esc(l.titulo)}</td>
                <td>${esc(l.autor)}</td>
                <td>${esc(l.editora)}</td>
                <td class="small text-muted">${esc(l.isbn)}</td>
                <td>${l.qtdDisponivel} / ${l.qtdTotal}</td>
                <td class="text-end">
                    <button class="btn btn-outline-danger action-btn rounded-pill" onclick="desativarLivro('${l.id}')">
                        <i class="bi bi-slash-circle"></i> Desativar
                    </button>
                </td>
            </tr>`;
        });

        div.innerHTML = html + '</tbody></table>';
    } catch (error) {
        div.innerHTML = '<p class="text-danger">Erro ao carregar o acervo.</p>';
    }
}

// DESATIVAR LIVRO (pede o motivo)
async function desativarLivro(id) {
    const motivo = prompt('Informe o motivo para desativar este livro:');
    if (!motivo) { alert('O motivo é obrigatório.'); return; }

    try {
        const response = await fetch(`${BACKEND_URL}/api/livros/${id}/desativar`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify({ motivo })
        });

        if (response.ok) {
            alert('Livro desativado com sucesso.');
            carregarAcervo();
        } else {
            alert('Erro: ' + await response.text());
        }
    } catch (error) {
        alert('Erro de comunicação com o servidor.');
    }
}

        function editarCategoria(id) {
    const cat = (window.categoriasCache || []).find(c => c.id === id);
    if (!cat) return;

    document.getElementById('editCatId').value = cat.id;
    document.getElementById('editCatNome').value = cat.nome;
    document.getElementById('editCatDesc').value = cat.descricao || '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalEditarCategoria')).show();
}

async function salvarEdicaoCategoria() {
    const id = document.getElementById('editCatId').value;
    const nome = document.getElementById('editCatNome').value.trim();
    const descricao = document.getElementById('editCatDesc').value;

    if (!nome) { alert('O nome é obrigatório.'); return; }

    try {
        const response = await fetch(`${BACKEND_URL}/api/livros/categorias/${id}`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify({ nome, descricao })
        });

        if (response.ok) {
            bootstrap.Modal.getInstance(document.getElementById('modalEditarCategoria')).hide();
            alert('Categoria atualizada!');
            carregarCategorias();
        } else {
            alert('Erro: ' + await response.text());
        }
    } catch (error) {
        alert('Erro de comunicação com o servidor.');
    }
}

function excluirCategoria(id) {
    const cat = (window.categoriasCache || []).find(c => c.id === id);
    if (!cat) return;

    document.getElementById('excluirCatId').value = cat.id;
    document.getElementById('excluirCatNome').textContent = cat.nome;
    document.getElementById('excluirCatMotivo').value = '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalExcluirCategoria')).show();
}

async function confirmarExclusaoCategoria() {
    const id = document.getElementById('excluirCatId').value;
    const motivo = document.getElementById('excluirCatMotivo').value.trim();

    if (!motivo) { alert('Informe o motivo da exclusão.'); return; }

    try {
        const response = await fetch(`${BACKEND_URL}/api/livros/categorias/${id}/desativar`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify({ motivo })
        });

        if (response.ok) {
            bootstrap.Modal.getInstance(document.getElementById('modalExcluirCategoria')).hide();
            alert('Categoria excluída com sucesso.');
            carregarCategorias();
        } else {
            alert(await response.text());
        }
    } catch (error) {
        alert('Erro de comunicação com o servidor.');
    }
}
