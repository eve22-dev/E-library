<!DOCTYPE html>

                            </div>
                            
                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="password" placeholder="Senha" required>
                                <label for="password">Senha</label>
                            </div>

                            <!-- Adicionei um ID ao botão para podermos mostrar um "Carregando..." -->
                            <button type="submit" id="btnSubmit" class="btn btn-primary btn-lg w-100 shadow-sm">Entrar</button>
                        </form>

                        <div class="mt-4">
                            <p class="small text-muted">Problemas para entrar? <a href="#" class="text-decoration-none">Contatar Suporte</a></p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
