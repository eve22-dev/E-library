<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-library | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center py-4 bg-light">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5 text-center">

                        <header class="mb-4">
                            <h1 class="display-6 fw-bold text-primary">E-library</h1>
                            <p class="text-muted small">Acesse sua conta</p>
                        </header>

                        <form id="loginForm">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="email" placeholder="nome@fatec.sp.gov.br" required>
                                <label for="email">E-mail Institucional</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="password" placeholder="Senha" required>
                                <label for="password">Senha</label>
                            </div>

                            <button type="submit" id="btnSubmit" class="btn btn-primary btn-lg w-100 shadow-sm">Entrar</button>
                        </form>

                        <div class="mt-4">
                            <p class="small text-muted">Problemas para entrar? <a href="suporte.html" class="text-decoration-none">Contatar Suporte</a></p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Conversa com o back-end (login e sessão) -->
    <script src="api.js"></script>
    <script src="script.js"></script>

    <!-- VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>
</body>
</html>
