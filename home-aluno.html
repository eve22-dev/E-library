    <!-- SDK do Supabase e Lógica de Navegação Unificada -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://axeyrwilhvbzlfukivhu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZXlyd2lsaHZiemxmdWtpdmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDE0OTYsImV4cCI6MjA5NDExNzQ5Nn0.8-hLkiSR6BPck-DtkiZiwMA5KRtfHUhjN61g4QPE68o';
        const { createClient } = supabase;
        const windowSupabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabase = windowSupabase;

        // Função unificada para checar papel e redirecionar para o perfil correto
        async function irParaPerfil(e) {
            e.preventDefault();
            const { data: { session } } = await window.supabase.auth.getSession();
            
            if (!session) {
                alert("Sessão expirada. Faça login novamente.");
                window.location.href = "index.html";
                return;
            }

            const { data: perfil, error } = await window.supabase
                .from('usuarios')
                .select('papel')
                .eq('id', session.user.id)
                .single();

            if (error || !perfil) {
                alert("Erro ao identificar o perfil do usuário.");
                return;
            }

            if (perfil.papel === 'aluno') {
                window.location.href = "perfil-aluno.html";
            } else if (perfil.papel === 'professor') {
                window.location.href = "perfil-professor.html";
            } else {
                alert("Acesso não autorizado.");
            }
        }

        // Atribui o evento aos botões de perfil (topo e barra lateral)
        document.getElementById('btnMeuPerfil').addEventListener('click', irParaPerfil);
        document.getElementById('sidebarMeuPerfil').addEventListener('click', irParaPerfil);

        // AQUI: Ação de Reservar conectada ao Supabase com alteração visual imediata
        document.querySelectorAll('.btn-acao-reservar').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const card = e.target.closest('.card-livro');
                const tituloLivro = card.querySelector('h6').textContent;
                const btnClicado = e.target; 

                const { data: { session } } = await window.supabase.auth.getSession();
                if (!session) {
                    alert("Você precisa estar logado para reservar um livro.");
                    window.location.href = "index.html";
                    return;
                }

                // Insere no banco
                const { error } = await window.supabase
                    .from('emprestimos')
                    .insert([
                        { 
                            user_id: session.user.id, 
                            status: 'ativo',
                            data_retirada: new Date().toISOString().split('T')[0],
                            data_prevista: new Date(Date.now() + 14*24*60*60*1000).toISOString().split('T')[0]
                        }
                    ]);

                if (error) {
                    console.error("Erro ao reservar:", error);
                    alert("Erro ao realizar a reserva. Tente novamente.");
                    return;
                }

                // Efeito visual imediato: transforma o botão
                btnClicado.textContent = 'JÁ RESERVADO';
                btnClicado.classList.remove('btn-primary', 'btn-reservar');
                btnClicado.classList.add('btn-danger', 'disabled'); 
                btnClicado.disabled = true;

                alert(`Livro "${tituloLivro}" reservado com sucesso!`);
            });
        });
    </script>
